const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
const pad = n => String(n).padStart(6, '0');
const blink = (period = 30) => Math.floor(frameCount / (period / 2)) % 2 === 0;

function hexToRgb(hex) {
  const n = parseInt(hex.slice(1), 16);
  return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
}
function mixRgb(a, b, t) { return a.map((v, i) => Math.round(v + (b[i] - v) * t)); }

function mulberry32(seed) {   // deterministic RNG so scenery is the same every visit
  return () => {
    seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function boxesOverlap(a, b) {
  return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
}
function pointInBox(px, py, b, padding = 0) {
  return px >= b.x - padding && px <= b.x + b.w + padding && py >= b.y - padding && py <= b.y + b.h + padding;
}

// Velocity that lands a projectile on (tx, ty) after T frames of discrete gravity.
function launch(x, y, tx, ty, grav, speedDiv, minT, maxT) {
  const T = Math.round(clamp(dist(x, y, tx, ty) / speedDiv, minT, maxT));
  return { T, vx: (tx - x) / T, vy: (ty - y - grav * T * (T + 1) / 2) / T };
}

function horizonAt(theme, x) {
  const [a1, f1, a2, f2] = theme.horizon;
  return Math.round(GROUND_Y - 5 + a1 * Math.sin(x * f1) + a2 * Math.sin(x * f2 + 1));
}
function horizonY(x) { return horizonAt(World.theme, x); }

// 8. PIXEL DRAWING PRIMITIVES (all target a p5.Graphics `g`)

function bakeSprite(rows, pal) {
  const img = createGraphics(Math.max(...rows.map(r => r.length)), rows.length);
  img.pixelDensity(1);
  img.noStroke();
  rows.forEach((row, y) => [...row].forEach((ch, x) => {
    if (!pal[ch]) return;
    img.fill(pal[ch]);
    img.rect(x, y, 1, 1);
  }));
  return img;
}

function solidPalette(pal, col) {
  return Object.fromEntries(Object.keys(pal).map(k => [k, col]));
}

function bakeSprites() {
  for (const [name, { rows, pal }] of Object.entries(SPRITE_DATA)) SPR[name] = bakeSprite(rows, PAL[pal]);
  SPR.ufo = bakeSprite(SPRITE_DATA.saucer.rows, PAL.ufo);
  SPR.heartEmpty = bakeSprite(SPRITE_DATA.heart.rows, PAL.heartEmpty);
  SPR.flyerFlash = bakeSprite(SPRITE_DATA.flyerA.rows, solidPalette(PAL.flyer, C.white));
  SPR.crawlerFlash = bakeSprite(SPRITE_DATA.crawlerA.rows, solidPalette(PAL.crawler, C.white));
  for (const [worldId, theme] of Object.entries(THEMES)) {
    const species = SPECIES[theme.species];
    for (const npc of theme.npcs) {
      const pal = { ...species.pal, [species.bodyKey]: npc.color, ...(npc.pal || {}) };
      SPR[npcSpriteKey(worldId, npc.name)] = species.frames.map(rows => bakeSprite(rows, pal));
    }
  }
}
function npcSpriteKey(worldId, name) { return `npc_${worldId}_${name}`; }

function makeLayer(w) {
  const g = createGraphics(w, VIEW_H);
  g.pixelDensity(1);
  g.noStroke();
  return g;
}

function blit(g, img, x, y, flip = false) {
  x = Math.round(x);
  y = Math.round(y);
  if (!flip) { g.image(img, x, y); return; }
  g.push();
  g.translate(x + img.width, y);
  g.scale(-1, 1);
  g.image(img, 0, 0);
  g.pop();
}

function pixelEllipse(g, cx, cy, rx, ry, col) {
  g.fill(col);
  for (let dy = -ry; dy <= ry; dy++) {
    const hw = Math.round(rx * Math.sqrt(Math.max(0, 1 - (dy * dy) / (ry * ry || 1))));
    g.rect(Math.round(cx - hw), Math.round(cy + dy), hw * 2 + 1, 1);
  }
}
function pixelDisc(g, cx, cy, r, col) { pixelEllipse(g, cx, cy, Math.round(r), Math.round(r), col); }

function pixelRing(g, cx, cy, r, col) {
  g.fill(col);
  const steps = Math.max(8, Math.round(r * 6));
  for (let i = 0; i < steps; i++) {
    const a = (i / steps) * TWO_PI;
    g.rect(Math.round(cx + Math.cos(a) * r), Math.round(cy + Math.sin(a) * r), 1, 1);
  }
}

function paintSparkle(g, x, y, core, glow) {
  g.fill(glow);
  g.rect(x - 1, y, 1, 1); g.rect(x + 1, y, 1, 1); g.rect(x, y - 1, 1, 1); g.rect(x, y + 1, 1, 1);
  g.fill(core);
  g.rect(x, y, 1, 1);
}

function paintPlanet(g, cx, cy, r, base, band, shade) {
  cx = Math.round(cx); cy = Math.round(cy); r = Math.round(r);
  for (let dy = -r; dy <= r; dy++) {
    const hw = Math.round(Math.sqrt(r * r - dy * dy));
    g.fill(band && (dy + r) % 4 === 1 ? band : base);
    g.rect(cx - hw, cy + dy, hw * 2 + 1, 1);
    const sw = Math.ceil(hw * 0.6);
    g.fill(shade);
    g.rect(cx + hw - sw + 1, cy + dy, sw, 1);
  }
  g.fill('rgba(255,255,255,0.7)');
  g.rect(cx - Math.round(r * 0.5), cy - Math.round(r * 0.5), Math.max(1, Math.round(r * 0.3)), 1);
}

// Ring drawn in two halves so the planet sits between them.
function paintRing(g, cx, cy, rx, ry, tilt, front, cols) {
  const steps = Math.round(rx * 8);
  for (let i = 0; i < steps; i++) {
    const a = (i / steps) * TWO_PI;
    if ((Math.sin(a) > 0) !== front) continue;
    cols.forEach((col, k) => {
      const s = 1 - k * 0.1;
      const px = Math.cos(a) * rx * s, py = Math.sin(a) * ry * s;
      g.fill(col);
      g.rect(Math.round(cx + px * Math.cos(tilt) - py * Math.sin(tilt)),
             Math.round(cy + px * Math.sin(tilt) + py * Math.cos(tilt)), 1, 1);
    });
  }
}

function paintRingedPlanet(g, x, y, r, rx, ry, tilt = -0.25) {
  const cols = [C.gold, '#ffe9a8', C.orange];
  paintRing(g, x, y, rx, ry, tilt, false, cols);
  paintPlanet(g, x, y, r, C.orange, C.gold, '#b3541e');
  paintRing(g, x, y, rx, ry, tilt, true, cols);
}

// Small planet icon used on the star map and in the flight scene.
function drawPlanetIcon(g, theme, x, y, r) {
  const ic = theme.icon;
  const tilt = ic.ringTilt === undefined ? -0.25 : ic.ringTilt;
  const ringCols = [ic.band || C.gold, ic.band ? C.gold : C.white];
  if (ic.ring) paintRing(g, x, y, r * 1.9, r * 0.5, tilt, false, ringCols);
  paintPlanet(g, x, y, r, ic.base, ic.band || null, ic.shade);
  if (ic.ring) paintRing(g, x, y, r * 1.9, r * 0.5, tilt, true, ringCols);
}

// ---------------------------------------------------------------------
// 9. SOUND — tiny square-wave synth, no assets needed
// ---------------------------------------------------------------------
const Sfx = {
  ctx: null,
  muted: false,

  unlock() {
    if (!this.ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      this.ctx = new AC();
    }
    if (this.ctx.state === 'suspended') this.ctx.resume();
  },
  ready() { return this.ctx && !this.muted; },

  tone(freq, dur, { type = 'square', vol = 0.04, slide = 0, delay = 0 } = {}) {
    if (!this.ready()) return;
    const t0 = this.ctx.currentTime + delay;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, t0);
    if (slide) osc.frequency.exponentialRampToValueAtTime(Math.max(30, freq + slide), t0 + dur);
    gain.gain.setValueAtTime(vol, t0);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    osc.connect(gain).connect(this.ctx.destination);
    osc.start(t0);
    osc.stop(t0 + dur + 0.02);
  },
  noise(dur, vol) {
    if (!this.ready()) return;
    const len = Math.floor(this.ctx.sampleRate * dur);
    const buf = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < len; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / len);
    const src = this.ctx.createBufferSource();
    const gain = this.ctx.createGain();
    src.buffer = buf;
    gain.gain.value = vol;
    src.connect(gain).connect(this.ctx.destination);
    src.start();
  },

  toss()     { this.tone(520, 0.15, { slide: -280, vol: 0.03 }); },
  boom()     { this.noise(0.35, 0.12); this.tone(140, 0.3, { type: 'triangle', slide: -90, vol: 0.08 }); },
  pop()      { this.noise(0.15, 0.05); this.tone(900, 0.15, { type: 'triangle', slide: 600, vol: 0.04 }); },
  eat()      { this.tone(660, 0.06); this.tone(880, 0.08, { delay: 0.07 }); },
  pickup()   { [523, 659, 784].forEach((f, i) => this.tone(f, 0.07, { delay: i * 0.05, vol: 0.03 })); },
  hurt()     { this.tone(300, 0.3, { type: 'sawtooth', slide: -200, vol: 0.05 }); },
  jump()     { this.tone(300, 0.12, { slide: 300, vol: 0.025 }); },
  slime()    { this.tone(180, 0.12, { type: 'triangle', slide: 120, vol: 0.03 }); },
  blip(alien) {
    if (alien) this.tone(500 + Math.random() * 500, 0.04, { type: 'triangle', slide: 200, vol: 0.03 });
    else this.tone(1200 + Math.random() * 300, 0.025, { vol: 0.012 });
  },
  select()   { this.tone(740, 0.05, { vol: 0.03 }); },
  empty()    { this.tone(110, 0.1, { vol: 0.03 }); },
  launch()   { this.noise(1.2, 0.07); this.tone(70, 1.2, { type: 'triangle', slide: 400, vol: 0.08 }); },
  land()     { this.noise(0.5, 0.05); this.tone(400, 0.5, { type: 'triangle', slide: -330, vol: 0.06 }); },
  thunder()  { this.noise(0.8, 0.05); this.tone(60, 0.8, { type: 'triangle', slide: -20, vol: 0.05 }); },
  wave()     { [392, 523, 659, 784].forEach((f, i) => this.tone(f, 0.1, { delay: i * 0.09, vol: 0.035 })); },
  gameOver() { [392, 330, 262, 196].forEach((f, i) => this.tone(f, 0.18, { delay: i * 0.16, type: 'triangle', vol: 0.06 })); },
};

// ---------------------------------------------------------------------
// 10. SCENERY PAINTERS (baked once per world)
// ---------------------------------------------------------------------
function paintSpace(g, theme) {
  const bands = theme.sky.map(hexToRgb);
  const nebulae = theme.nebulae.map(n => ({ ...n, rgb: hexToRgb(n.col) }));
  g.loadPixels();
  for (let y = 0; y < VIEW_H; y++) {
    for (let x = 0; x < VIEW_W; x++) {
      const th = BAYER4[y & 3][x & 3];
      const t = clamp(y / GROUND_Y, 0, 1) * (bands.length - 1);
      const i = Math.min(Math.floor(t), bands.length - 2);
      let rgb = t - i > th ? bands[i + 1] : bands[i];      // ordered-dither gradient
      for (const n of nebulae) {
        const d = Math.hypot(x - n.x, (y - n.y) * 1.6) / n.r;
        if (d >= 1) continue;
        const k = (1 - d) * (0.35 + noise(x * 0.06, y * 0.06) * 0.9);
        if (k > th) rgb = mixRgb(rgb, n.rgb, k > th + 0.35 ? 0.55 : 0.3);
      }
      const idx = 4 * (y * VIEW_W + x);
      g.pixels[idx] = rgb[0];
      g.pixels[idx + 1] = rgb[1];
      g.pixels[idx + 2] = rgb[2];
      g.pixels[idx + 3] = 255;
    }
  }
  g.updatePixels();
}

function paintFarStars(g, rng, count) {
  const cols = ['rgba(255,255,255,0.9)', 'rgba(201,191,255,0.7)', 'rgba(125,249,255,0.6)', 'rgba(255,110,199,0.6)'];
  for (let i = 0; i < count; i++) {
    g.fill(cols[Math.floor(rng() * cols.length)]);
    g.rect(Math.floor(rng() * VIEW_W), Math.floor(rng() * (GROUND_Y - 8)), 1, 1);
  }
}

function paintGalaxy(g, gx, rng) {
  const inner = color(gx.inner);
  const outer = color(gx.outer);
  const n = gx.size * 18;
  for (let arm = 0; arm < 2; arm++) {
    for (let i = 0; i < n; i++) {
      const t = i / n;
      const ang = arm * PI + t * 5 + (rng() - 0.5) * 0.5;
      const r = t * gx.size + (rng() - 0.5) * 1.5;
      const x = Math.cos(ang) * r;
      const y = Math.sin(ang) * r * 0.42;
      const c = lerpColor(inner, outer, t);
      c.setAlpha(255 * (1 - t * 0.6));
      g.fill(c);
      g.rect(Math.round(gx.x + x * Math.cos(gx.tilt) - y * Math.sin(gx.tilt)),
             Math.round(gx.y + x * Math.sin(gx.tilt) + y * Math.cos(gx.tilt)), 1, 1);
    }
  }
  pixelEllipse(g, gx.x, gx.y, 2, 1, 'rgba(255,255,255,0.5)');
  g.fill(C.white);
  g.rect(gx.x, gx.y, 1, 1);
}

function paintOrbits(g) {
  g.fill('rgba(185,103,255,0.45)');
  for (const p of SOLAR.planets) {
    const steps = p.rx * 4;
    for (let i = 0; i < steps; i += 2) {
      const a = (i / steps) * TWO_PI;
      g.rect(Math.round(SOLAR.x + Math.cos(a) * p.rx), Math.round(SOLAR.y + Math.sin(a) * p.ry), 1, 1);
    }
  }
}

function paintEarth(g, x, y) {
  paintPlanet(g, x, y, 5, C.blue, null, '#1b2a8a');
  g.fill(C.green);
  [[-3, -1, 2, 2], [0, -3, 2, 1], [-1, 2, 3, 1], [1, 0, 1, 2]].forEach(([dx, dy, w, h]) => g.rect(x + dx, y + dy, w, h));
  g.fill(C.moonLight);
  g.rect(x + 9, y - 5, 1, 1);   // Earth's own little moon
}

function paintGround(g, theme) {
  const { light, base, dark, mid } = theme.ground;
  for (let x = 0; x < g.width; x++) {
    const hy = horizonAt(theme, x);
    for (let y = hy; y < VIEW_H; y++) {
      const t = (y - hy) / (VIEW_H - hy);
      let col = t * 1.3 > BAYER4[y & 3][x & 3] ? dark : base;
      if (theme.stripes && ((y - hy) >> 2) % 2 === 1 && col === base) col = mid;   // ring bands
      g.fill(y === hy ? light : col);
      g.rect(x, y, 1, 1);
    }
  }
}

function paintCraters(g, theme, craters) {
  for (const [cx, cy, rx, ry] of craters) {
    pixelEllipse(g, cx, cy + 1, rx, ry, theme.ground.light);
    pixelEllipse(g, cx, cy, rx, ry, theme.ground.shade);
  }
}

function paintSpeckles(g, rng, theme, count, cols) {
  for (let i = 0; i < count; i++) {
    const x = Math.floor(rng() * g.width);
    g.fill(cols[Math.floor(rng() * cols.length)]);
    g.rect(x, horizonAt(theme, x) + 2 + Math.floor(rng() * 20), 1, 1);
  }
}

function paintCrystals(g, rng, theme, count, cols) {
  for (let i = 0; i < count; i++) {
    const x = Math.floor(rng() * g.width);
    const y = horizonAt(theme, x) + 4 + Math.floor(rng() * 14);
    g.fill(cols[i % cols.length]);
    g.rect(x, y, 1, 2);
    g.rect(x + 1, y + 1, 1, 1);
  }
}

function paintRocks(g, rng, theme, count, col, highlight) {
  for (let i = 0; i < count; i++) {
    const x = Math.floor(rng() * g.width);
    const y = horizonAt(theme, x) + 3 + Math.floor(rng() * 14);
    const rx = 1 + Math.floor(rng() * 3);
    pixelEllipse(g, x, y, rx, 1, col);
    g.fill(highlight);
    g.rect(x - rx + 1, y - 1, rx, 1);
  }
}

// Places a sprite standing on the horizon; returns its top-left.
function paintProp(g, theme, img, x) {
  const pos = { x: x - Math.floor(img.width / 2), y: horizonAt(theme, x) + 1 - img.height };
  blit(g, img, pos.x, pos.y);
  return pos;
}

function paintHabitat(g, theme, h) {
  const base = horizonAt(theme, h.x) + 1;
  const bw = Math.round(h.r * 1.2), bh = Math.round(h.r * 0.5);
  const bx = h.x - Math.floor(bw / 2), by = base - bh;
  g.fill('#2a1850');
  g.rect(bx, by, bw, bh);
  g.fill(C.moonShade);
  g.rect(bx, by, bw, 1);
  g.fill(C.moonLight);
  g.rect(h.x, base - h.r - 3, 1, 3);   // antenna
  for (let dy = -h.r; dy <= 0; dy++) {
    const hw = Math.round(Math.sqrt(h.r * h.r - dy * dy));
    g.fill('rgba(5,217,232,0.16)');
    g.rect(h.x - hw, base + dy, hw * 2 + 1, 1);
  }
  g.fill('rgba(125,249,255,0.85)');
  for (let a = 0; a <= PI; a += 0.03) g.rect(Math.round(h.x + Math.cos(a) * h.r), Math.round(base - Math.sin(a) * h.r), 1, 1);
  g.fill('rgba(255,255,255,0.7)');
  g.rect(h.x - Math.round(h.r * 0.5), base - Math.round(h.r * 0.7), 1, 2);

  const windows = [];
  for (let wx = bx + 1; wx + 2 <= bx + bw - 1; wx += 3) windows.push({ x: wx, y: by + 2 });
  return { windows, beacon: { x: h.x, y: base - h.r - 4 } };
}

function randomCraters(rng, theme, width, count) {
  return Array.from({ length: count }, () => {
    const x = Math.floor(rng() * width);
    return [x, horizonAt(theme, x) + 5 + Math.floor(rng() * 14), 2 + Math.floor(rng() * 6), 1 + Math.floor(rng() * 2)];
  });
}

function paintCloud(g, x, y, w) {   // fluffy daytime cloud
  const puffs = [[-w * 0.5, 1, w * 0.35], [0, -1, w * 0.45], [w * 0.5, 1, w * 0.3]];
  puffs.forEach(([dx, dy, r]) => pixelEllipse(g, x + dx, y + dy + 1, Math.round(r), Math.round(r * 0.5), '#cfe6ff'));
  puffs.forEach(([dx, dy, r]) => pixelEllipse(g, x + dx, y + dy, Math.round(r), Math.round(r * 0.5), C.white));
}

function paintCloudTower(g, theme, x, h) {   // Jupiter's towering storm clouds
  const base = horizonAt(theme, x) + 2;
  for (let i = 0; i < 3; i++) {
    const r = 9 - i * 2;
    pixelDisc(g, x + (i % 2 ? 4 : -3), base - i * (h / 3), r, i % 2 ? '#e8c090' : '#f5dcb4');
  }
}

function paintHills(g, theme, col, rim) {   // rolling green hills behind the horizon
  for (let x = 0; x < g.width; x++) {
    const top = horizonAt(theme, x) - 6 - Math.round(5 * Math.sin(x * 0.018) + 3 * Math.sin(x * 0.05 + 2));
    g.fill(rim);
    g.rect(x, top, 1, 1);
    g.fill(col);
    g.rect(x, top + 1, 1, horizonAt(theme, x) - top + 1);
  }
}

function paintFlowers(g, rng, theme, count) {
  const petals = [C.hotPink, C.yellow, C.white, C.purple];
  for (let i = 0; i < count; i++) {
    const x = Math.floor(rng() * g.width);
    const y = horizonAt(theme, x) + 3 + Math.floor(rng() * 14);
    g.fill('#1f8a2e'); g.rect(x, y + 1, 1, 1);
    g.fill(petals[i % petals.length]); g.rect(x, y, 1, 1);
  }
}

function paintTree(g, theme, x) {
  const base = horizonAt(theme, x) + 1;
  g.fill('#6a3e1a');
  g.rect(x - 1, base - 7, 2, 7);
  pixelDisc(g, x, base - 11, 6, '#2fae3f');
  pixelDisc(g, x - 2, base - 13, 3, '#7de06a');
  g.fill(C.red);   // apples!
  g.rect(x + 2, base - 10, 1, 1); g.rect(x - 3, base - 8, 1, 1); g.rect(x + 1, base - 14, 1, 1);
}

function paintBarn(g, theme, x) {
  const base = horizonAt(theme, x) + 1;
  const w = 16, h = 10;
  for (let i = 0; i < 6; i++) {   // roof
    g.fill(i === 0 ? '#ffb3a8' : '#8a1f1f');
    g.rect(x - w / 2 - 1 + i, base - h - 6 + i, w + 2 - i * 2, 1);
  }
  g.fill('#d9342b');
  g.rect(x - w / 2, base - h, w, h);
  g.fill(C.white);   // barn door with the classic X
  g.rect(x - 3, base - 7, 6, 7);
  g.fill('#d9342b');
  for (let i = 0; i < 5; i++) { g.rect(x - 2 + i, base - 6 + i, 1, 1); g.rect(x + 2 - i, base - 6 + i, 1, 1); }
}

function paintCarrotGarden(g, theme, from, to, soil = C.moonShade) {
  for (let x = from; x <= to; x += 6) {
    const y = horizonAt(theme, x) + 3;
    g.fill(soil); g.rect(x - 1, y + 2, 4, 1);
    g.fill(C.orange);    g.rect(x, y + 1, 2, 1);
    g.fill(C.green);     g.rect(x - 1, y - 1, 1, 2); g.rect(x + 2, y - 1, 1, 2); g.rect(x, y, 2, 1);
  }
}

function paintMesa(g, theme, m) {   // flat-topped Martian rock towers behind the horizon
  const base = horizonAt(theme, m.x) + 2;
  for (let dy = 0; dy <= m.h; dy++) {
    const w = m.w + Math.floor(dy / 3) * 2;
    g.fill(dy === 0 ? '#b8452e' : dy % 4 === 0 ? '#6a2018' : '#7a2a22');
    g.rect(m.x - Math.floor(w / 2), base - m.h + dy, w, 1);
  }
}

function paintVolcano(g, theme, v) {   // returns the crater position for lava effects
  const base = horizonAt(theme, v.x) + 2;
  const top = base - v.h;
  for (let dy = 0; dy <= v.h; dy++) {
    const hw = Math.max(1, Math.round((v.w / 2) * (dy / v.h)));
    g.fill('#4a1535');
    g.rect(v.x - hw, top + dy, hw * 2 + 1, 1);
    g.fill('#6b2048');
    g.rect(v.x - hw, top + dy, Math.max(1, Math.round(hw * 0.4)), 1);
  }
  g.fill(C.orange);   // lava trickles
  for (let dy = 1; dy < v.h * 0.6; dy += 1) g.rect(v.x + Math.round(Math.sin(dy * 0.7) * 1.5), top + dy, 1, 1);
  return { x: v.x, y: top };
}

function paintLavaCracks(g, rng, theme, count) {
  for (let i = 0; i < count; i++) {
    let x = Math.floor(rng() * g.width);
    let y = horizonAt(theme, x) + 4 + Math.floor(rng() * 14);
    const len = 4 + Math.floor(rng() * 7);
    for (let k = 0; k < len; k++) {
      g.fill(k % 3 === 0 ? C.yellow : '#ff6a2a');
      g.rect(x, y, 1, 1);
      x += 1;
      y += Math.floor(rng() * 3) - 1;
    }
  }
}

function paintSpire(g, theme, x, h, col, highlight) {   // crystal spike
  const base = horizonAt(theme, x) + 1;
  for (let dy = 0; dy < h; dy++) {
    const w = 1 + Math.floor((dy / h) * 3);
    g.fill(col);
    g.rect(x - Math.floor(w / 2), base - h + dy, w, 1);
    g.fill(highlight);
    g.rect(x - Math.floor(w / 2), base - h + dy, 1, 1);
  }
}

function paintIgloo(g, theme, x) {
  const base = horizonAt(theme, x) + 1;
  const r = 9;
  for (let dy = -r; dy <= 0; dy++) {
    const hw = Math.round(Math.sqrt(r * r - dy * dy));
    g.fill(dy % 3 === 0 ? '#a8d8f0' : C.white);   // ice-block seams
    g.rect(x - hw, base + dy, hw * 2 + 1, 1);
  }
  g.fill('#a8d8f0');
  for (let dy = -r + 1; dy < 0; dy += 3) g.rect(x + ((dy / 3) % 2 ? 3 : -2), base + dy, 1, 2);
  pixelEllipse(g, x, base, 3, 4, '#0b2a4a');   // doorway
}

function paintSnowman(g, theme, x) {
  const base = horizonAt(theme, x) + 1;
  pixelDisc(g, x, base - 4, 4, C.white);
  pixelDisc(g, x, base - 11, 3, C.white);
  pixelDisc(g, x, base - 16, 2, C.white);
  g.fill(C.ink);
  g.rect(x - 1, base - 17, 1, 1); g.rect(x + 1, base - 17, 1, 1);
  g.rect(x, base - 12, 1, 1); g.rect(x, base - 9, 1, 1);
  g.fill(C.orange);   // a carrot nose. The bunny is NOT okay with this.
  g.rect(x + 1, base - 16, 2, 1);
  g.fill('#8a4b2a');
  g.rect(x - 6, base - 13, 3, 1); g.rect(x + 4, base - 13, 3, 1);
}

// ---------------------------------------------------------------------
// 11. WORLD — builds, caches and draws the current planet
// ---------------------------------------------------------------------
function buildWorld(id) {
  const theme = THEMES[id];
  const rng = mulberry32(theme.seed);
  noiseSeed(theme.seed);

  const sky = makeLayer(VIEW_W);
  paintSpace(sky, theme);
  paintFarStars(sky, rng, theme.farStars);
  if (theme.paintSky) theme.paintSky(sky, rng);

  const ground = makeLayer(theme.width);
  const backdrop = (theme.paintBackdrop && theme.paintBackdrop(ground, rng)) || {};
  paintGround(ground, theme);
  const props = { ...backdrop, ...((theme.paintGround && theme.paintGround(ground, rng)) || {}) };

  const stars = Array.from({ length: theme.twinkles }, () => ({
    x: Math.floor(rng() * VIEW_W), y: Math.floor(rng() * (GROUND_Y - 14)),
    phase: rng() * TWO_PI, speed: 0.02 + rng() * 0.05, col: NEON[Math.floor(rng() * NEON.length)],
  }));
  return { id, theme, sky, ground, stars, props, fx: theme.initFx ? theme.initFx() : {} };
}

const World = {
  cache: {},
  id: 'moon',
  data: null,
  t: 0,
  comets: [],
  traffic: [],
  weather: [],
  cometT: 90,
  trafficT: 400,

  get theme() { return THEMES[this.id]; },
  get(id) { return this.cache[id] || (this.cache[id] = buildWorld(id)); },

  enter(id) {
    this.id = id;
    this.data = this.get(id);
    this.comets = [];
    this.traffic = this.theme.traffic ? [{ type: 'ufo', dir: 1, speed: 0.35, x: 70, y: 70, t: 0 }] : [];
    const w = this.theme.weather;
    this.weather = w ? Array.from({ length: w.count }, (_, i) => ({
      x: random(VIEW_W), y: random(VIEW_H), s: random(0.4, 1), p: random(TWO_PI), col: w.colors[i % w.colors.length],
    })) : [];
  },

  update(dCam) {
    this.t++;
    const theme = this.theme;
    if (theme.comets && --this.cometT <= 0) {
      this.comets.push({ x: random(60, VIEW_W + 40), y: random(-10, 30), vx: random(-2.2, -1.4), vy: random(0.5, 0.9) });
      this.cometT = random(180, 420);
    }
    if (theme.traffic && --this.trafficT <= 0) {
      this.spawnTraffic();
      this.trafficT = random(300, 560);
    }
    this.comets.forEach(c => { c.x += c.vx; c.y += c.vy; });
    this.comets = this.comets.filter(c => c.x > -30 && c.y < GROUND_Y - 10);
    this.traffic.forEach(v => { v.t++; v.x += v.dir * v.speed; });
    this.traffic = this.traffic.filter(v => v.x > -30 && v.x < VIEW_W + 30);
    this.updateWeather(dCam);
    if (theme.updateFx) theme.updateFx(this.data, this.t);
  },

  updateWeather(dCam) {
    const w = this.theme.weather;
    if (!w) return;
    for (const p of this.weather) {
      p.x -= dCam * (0.4 + 0.6 * p.s);   // parallax with the camera
      if (w.type === 'dust')   { p.x += 0.6 + 1.4 * p.s; p.y += Math.sin(this.t * 0.05 + p.p) * 0.25; }
      if (w.type === 'embers') { p.y -= 0.15 + 0.35 * p.s; p.x += Math.sin(this.t * 0.04 + p.p) * 0.2; }
      if (w.type === 'snow')   { p.y += 0.2 + 0.4 * p.s; p.x += Math.sin(this.t * 0.03 + p.p) * 0.3 - 0.15; }
      if (w.type === 'sparkle') p.y += 0.05 * p.s;
      if (w.type === 'petals')   { p.y += 0.15 + 0.2 * p.s; p.x += Math.sin(this.t * 0.02 + p.p) * 0.5 + 0.2; }
      if (w.type === 'diamonds') p.y += 0.4 + 0.5 * p.s;
      p.x = ((p.x % VIEW_W) + VIEW_W) % VIEW_W;
      if (p.y > VIEW_H) p.y -= VIEW_H + 2;
      if (p.y < -2) p.y += VIEW_H + 2;
    }
  },

  spawnTraffic() {
    const type = random(['rocket', 'rocket', 'ufo', 'satellite']);
    const dir = random([-1, 1]);
    const speed = { rocket: 0.9, ufo: 0.35, satellite: 0.18 }[type];
    this.traffic.push({ type, dir, speed, x: dir > 0 ? -20 : VIEW_W + 20, y: random(44, 96), t: 0 });
  },

  // Far-away sky: view coordinates, never scrolls.
  drawSky(g) {
    const theme = this.theme;
    g.image(this.data.sky, 0, 0);
    for (const s of this.data.stars) {
      const v = Math.sin(this.t * s.speed + s.phase);
      if (v < -0.3) continue;
      if (v > 0.9) paintSparkle(g, s.x, s.y, s.col, s.col);
      else { g.fill(s.col); g.rect(s.x, s.y, 1, 1); }
    }
    if (theme.drawSkyFx) theme.drawSkyFx(g, this.data, this.t);
    this.comets.forEach(c => drawComet(g, c));
    this.traffic.forEach(v => drawVehicle(g, v));
  },

  // Ground, props, aliens and the rocket: world coordinates (caller applies the camera).
  drawGround(g) {
    const theme = this.theme;
    g.image(this.data.ground, 0, 0);
    if (theme.drawGroundFx) theme.drawGroundFx(g, this.data, this.t);
    if (isExplore()) drawCarrotShip(g);
    currentNpcs().forEach(npc => npc.draw(g, this.t));
  },

  drawWeather(g) {
    const w = this.theme.weather;
    if (!w) return;
    for (const p of this.weather) {
      const x = Math.round(p.x), y = Math.round(p.y);
      if (w.type === 'sparkle' || w.type === 'diamonds') {
        const v = Math.sin(this.t * 0.1 + p.p * 5);
        if (v < 0.3) continue;
        if (v > 0.92) { paintSparkle(g, x, y, p.col, p.col); continue; }
      }
      g.fill(p.col);
      g.rect(x, y, w.type === 'dust' && p.s > 0.7 ? 2 : p.s > 0.85 ? 2 : 1, w.type === 'snow' && p.s > 0.85 ? 2 : 1);
    }
  },
};

// --- animated sky pieces ----------------------------------------------
function drawSolarSystem(g, t) {
  const { x, y, planets } = SOLAR;
  const bodies = planets.map((p, i) => {
    const a = t * p.speed + i * 1.7;
    return { p, px: x + Math.cos(a) * p.rx, py: y + Math.sin(a) * p.ry, front: Math.sin(a) > 0 };
  });
  const drawBody = b => pixelDisc(g, b.px, b.py, b.p.r, b.p.col);
  bodies.filter(b => !b.front).forEach(drawBody);
  pixelDisc(g, x, y, Math.sin(t * 0.08) > 0 ? 7 : 6, 'rgba(255,159,28,0.35)');
  pixelDisc(g, x, y, 4, C.gold);
  pixelDisc(g, x - 1, y - 1, 2, C.yellow);
  bodies.filter(b => b.front).forEach(drawBody);
}

function drawAurora(g, t) {   // Neptune's dancing sky ribbons
  const ribbons = [[C.green, 0.22], [C.cyan, 0.2], [C.purple, 0.18]];
  ribbons.forEach(([col, alpha], r) => {
    const c = color(col);
    c.setAlpha(255 * alpha);
    g.fill(c);
    for (let x = 0; x < VIEW_W; x++) {
      const y = 18 + r * 11 + Math.sin(x * 0.03 + t * 0.02 + r) * 6 + Math.sin(x * 0.07 - t * 0.015) * 3;
      g.rect(x, Math.round(y), 1, 5 + Math.round(Math.sin(x * 0.1 + t * 0.03) * 2));
    }
  });
}

function drawComet(g, c) {
  for (let k = 10; k >= 0; k--) {
    const px = Math.round(c.x - c.vx * k * 0.8), py = Math.round(c.y - c.vy * k * 0.8);
    if (py >= GROUND_Y - 12) continue;
    g.fill(k < 2 ? C.white : k < 5 ? C.cyan : 'rgba(185,103,255,0.6)');
    g.rect(px, py, 1, 1);
  }
}

function drawVehicle(g, v) {
  const flip = v.dir < 0;
  if (v.type === 'rocket') {
    blit(g, SPR.rocket, v.x - 5, v.y - 2, flip);
    const tailX = flip ? v.x + 6 : v.x - 6;
    for (let i = 0; i < 4; i++) {
      if (random() < 0.2) continue;
      g.fill(i < 1 ? C.yellow : i < 3 ? C.orange : C.pink);
      g.rect(Math.round(tailX - v.dir * i), Math.round(v.y) + (i > 1 ? Math.floor(random(-1, 2)) : 0), 1, 1);
    }
  } else if (v.type === 'ufo') {
    const y = Math.round(v.y + Math.sin(v.t * 0.05) * 2);
    for (let i = 0; i < 16; i++) {   // tractor beam
      const hw = 2 + Math.floor(i / 3);
      g.fill(`rgba(185,255,92,${(0.3 - i * 0.012).toFixed(3)})`);
      g.rect(Math.round(v.x) - hw, y + 4 + i, hw * 2 + 1, 1);
    }
    blit(g, SPR.cow, v.x - 4, y + 10 + Math.round(Math.sin(v.t * 0.1) * 2), flip);
    blit(g, SPR.ufo, v.x - 7, y - 3);
  } else {
    blit(g, SPR.satellite, v.x - 4, v.y - 1);
    if (Math.floor(v.t / 20) % 2) { g.fill(C.red); g.rect(Math.round(v.x), Math.round(v.y) - 2, 1, 1); }
  }
}

function drawCarrotFlag(g, theme, x, t) {
  const fy = horizonAt(theme, x);
  g.fill(C.moonLight);
  g.rect(x, fy - 14, 1, 14);
  for (let i = 0; i < 7; i++) {
    const wave = Math.round(Math.sin(t * 0.1 + i * 0.8) * 0.8);
    g.fill(i < 2 ? C.green : C.orange);
    g.rect(x + 1 + i, fy - 14 + wave + (i < 2 ? 1 : 0), 1, i < 2 ? 2 : 4);
  }
}

// --- the Carrot Rocket --------------------------------------------------
function shipLift() { return game.travel ? game.travel.lift || 0 : 0; }
function shipTop() { return horizonY(World.theme.shipX) + 1 - SPR.carrotShip.height - shipLift(); }
function shipBox() { return { x: World.theme.shipX - 5, y: shipTop(), w: 11, h: SPR.carrotShip.height }; }

function drawCarrotShip(g) {
  const x = World.theme.shipX;
  const top = Math.round(shipTop());
  blit(g, SPR.carrotShip, x - 5, top);
  const firing = game.travel && (game.travel.phase === 'launch' || game.travel.phase === 'landing');
  if (firing) {
    const bottom = top + SPR.carrotShip.height;
    for (let i = 0; i < 6; i++) {
      g.fill(i < 2 ? C.yellow : i < 4 ? C.orange : C.pink);
      g.rect(x - 1 + Math.floor(random(3)), bottom + i, 1, 1);
    }
  } else if (Math.floor(World.t / 30) % 2) {   // idle "ready" light
    g.fill(C.lime);
    g.rect(x, top + 2, 1, 1);
  }
}

// ---------------------------------------------------------------------
// 12. ENTITIES
// ---------------------------------------------------------------------
class Bunny {
  constructor(x = VIEW_W / 2) {
    this.x = x;
    this.y = GROUND_Y;
    this.vy = 0;
    this.face = 1;
    this.onGround = true;
    this.walkT = 0;
    this.invulnT = 0;
    this.chewT = 0;
    this.blinkT = 120;
  }

  get box() { return { x: this.x - 5, y: this.y - 14, w: 10, h: 14 }; }

  update(ctrl) {
    const speed = game.hunger < 25 ? 0.9 : 1.3;   // hangry bunnies drag their paws
    if (ctrl.left) { this.x -= speed; this.face = -1; }
    if (ctrl.right) { this.x += speed; this.face = 1; }
    this.x = clamp(this.x, 8, worldWidth() - 8);
    this.walkT = ctrl.left !== ctrl.right ? this.walkT + 1 : 0;
    if (this.onGround && this.walkT % 14 === 7) {
      particles.push(new Particle(this.x - this.face * 4, this.y - 1, -this.face * 0.2, -0.2, 18, World.theme.ground.light));
    }

    this.vy += GRAVITY * (isExplore() ? World.theme.gravity : 1);   // heavier planets, smaller hops
    this.y += this.vy;
    if (this.y >= GROUND_Y) {
      if (!this.onGround) burst(this.x, GROUND_Y - 1, 5, [World.theme.ground.light, World.theme.ground.base], 0.6);
      this.y = GROUND_Y;
      this.vy = 0;
      this.onGround = true;
    }

    if (this.invulnT > 0) this.invulnT--;
    if (this.chewT > 0) this.chewT--;
    if (--this.blinkT < 0) this.blinkT = random(120, 260);
  }

  jump() {
    if (!this.onGround) return;
    this.vy = -2.6;
    this.onGround = false;
    Sfx.jump();
  }

  hurt(reason = 'hit', force = false) {
    if (game.state !== 'play' || isExplore() || (this.invulnT > 0 && !force)) return;
    game.hearts--;
    this.invulnT = INVULN_FRAMES;
    game.shake = 5;
    Sfx.hurt();
    burst(this.x, this.y - 8, 10, [C.hotPink, C.white], 1.2);
    if (game.hearts <= 0) { gameOver(); return; }
    say(game.hearts === 1 ? 'lowHeart' : reason, true);
  }

  draw(g, mood) {
    if (this.invulnT > 0 && Math.floor(this.invulnT / 4) % 2 === 0) return;
    const bob = this.onGround && Math.floor(this.walkT / 6) % 2 ? -1 : 0;
    const sx = Math.round(this.x - 6);
    const sy = Math.round(this.y - 16 + bob);
    blit(g, mood.earsUp ? SPR.bunnyUp : SPR.bunnyFlop, sx, sy, this.face < 0);

    g.fill(PAL.bunny.W);   // pom-pom tail
    g.rect(this.face > 0 ? sx - 1 : sx + 13, sy + 12, 1, 2);

    this.drawFace(g, sx, sy, mood.face);
    this.drawMoodMark(g, sx, sy, mood);
  }

  drawFace(g, sx, sy, face) {
    const px = (x, y, col) => { g.fill(col); g.rect(sx + x, sy + y, 1, 1); };
    const { K, P } = PAL.bunny;
    const blinking = this.blinkT < 6;

    if (face === 'happy') {
      [[3, 8], [4, 7], [5, 8], [7, 8], [8, 7], [9, 8]].forEach(([x, y]) => px(x, y, K));
    } else if (face === 'hurt') {
      [[3, 7], [4, 8], [3, 9], [9, 7], [8, 8], [9, 9]].forEach(([x, y]) => px(x, y, K));
    } else if (blinking) {
      [[3, 8], [4, 8], [8, 8], [9, 8]].forEach(([x, y]) => px(x, y, K));
    } else if (face === 'angry') {
      [[3, 6], [4, 7], [9, 6], [8, 7]].forEach(([x, y]) => px(x, y, K));   // furrowed brows
      px(4, 8, C.red); px(8, 8, C.red);
    } else {   // 'meh': heavy-lidded side-eye
      [[3, 7], [4, 7], [8, 7], [9, 7]].forEach(([x, y]) => px(x, y, K));
      px(4, 8, K); px(9, 8, K);
    }

    if (this.chewT > 0) {
      if (Math.floor(this.chewT / 5) % 2) { px(6, 9, P); px(6, 10, K); }
      else { px(5, 9, K); px(7, 9, K); }
    } else if (face === 'happy') {
      px(5, 9, K); px(6, 10, K); px(7, 9, K);   // 'w' mouth
    } else {
      px(5, 10, K); px(6, 9, K); px(7, 10, K);  // pout
    }
  }

  drawMoodMark(g, sx, sy, mood) {
    const mx = sx + (this.face > 0 ? 12 : 0);
    if (mood === MOODS.hangry && blink(30)) {
      g.fill(C.red);
      g.rect(mx, sy + 2, 1, 3);
      g.rect(mx - 1, sy + 3, 3, 1);
    } else if (mood === MOODS.sassy && Math.floor(frameCount / 20) % 3 === 0) {
      g.fill(C.yellow);
      g.rect(mx, sy + 1, 1, 3);
      g.rect(mx - 1, sy + 2, 3, 1);
    }
  }
}

// A friendly alien. Chatty in EXPLORE mode.
class Npc {
  constructor(data, worldId) {
    Object.assign(this, data);
    this.worldId = worldId;
    this.species = SPECIES[THEMES[worldId].species];
    this.frames = SPR[npcSpriteKey(worldId, data.name)];
    this.chatIndex = 0;
    this.met = false;
  }

  get top() { return horizonY(this.x) - 7 - (this.species.float ? 3 : 0); }
  get box() { return { x: this.x - 4, y: this.top, w: 8, h: 8 }; }
  get talking() { return speech.speaker === this && speech.life > 0; }
  get tagColor() { return this.tag || this.color; }   // readable name colour for dark-bodied aliens

  nextChat() {
    const chat = this.chats[this.chatIndex % this.chats.length];
    this.chatIndex++;
    return chat;
  }

  draw(g, t) {
    const hop = this.talking && Math.floor(t / 6) % 2 ? 1 : 0;
    const float = this.species.float ? Math.round(Math.sin(t * 0.05 + this.x) * 1.5) : 0;
    const top = this.top - hop + float;
    const frame = Math.floor((t + this.x) / 22) % 2;
    blit(g, this.frames[frame], this.x - Math.floor(this.frames[0].width / 2), top);
    if (this.crown) {
      g.fill(C.gold);
      g.rect(this.x - 2, top - 2, 5, 1);
      g.rect(this.x - 2, top - 3, 1, 1); g.rect(this.x, top - 3, 1, 1); g.rect(this.x + 2, top - 3, 1, 1);
    }
    if (isExplore() && !this.met && game.state !== 'title') {   // bouncing "!" = not met yet
      const by = top - 8 + Math.round(Math.sin(t * 0.15));
      g.fill(C.yellow);
      g.rect(this.x, by, 1, 3);
      g.rect(this.x, by + 4, 1, 1);
    }
  }
}

class Enemy {
  constructor({ hp, points, w, h, frames, flash, goo }) {
    Object.assign(this, { hp, points, w, h, frames, flash, goo });
    this.t = Math.floor(random(1000));
    this.flashT = 0;
    this.bobY = 0;
    this.dead = false;
  }

  get box() { return { x: this.x - this.w / 2, y: this.y - this.h / 2, w: this.w, h: this.h }; }

  tick() {
    this.t++;
    if (this.flashT > 0) this.flashT--;
  }

  damage(n) {
    if (this.dead) return false;
    this.hp -= n;
    this.flashT = 6;
    if (this.hp > 0) return false;
    this.dead = true;
    onEnemyKilled(this);
    return true;
  }

  draw(g) {
    const img = this.flashT > 0 ? this.flash : this.frames[Math.floor(this.t / 14) % 2];
    blit(g, img, this.x - this.w / 2, this.y - this.h / 2 + this.bobY);
  }
}

// Hovers in the sky and lobs slime at the bunny.
class Flyer extends Enemy {
  constructor() {
    super({ hp: 1, points: 100, w: 11, h: 8, frames: [SPR.flyerA, SPR.flyerB], flash: SPR.flyerFlash,
            goo: [C.pink, C.hotPink, C.lime] });
    this.x = random(20, VIEW_W - 20);
    this.y = -8;
    this.homeY = random(34, 66);
    this.dir = random([-1, 1]);
    this.speed = 0.3 + game.wave * 0.03;
    this.shootT = random(140, 240);
  }

  get vx() { return this.dir * this.speed; }

  update() {
    this.tick();
    this.homeY = Math.min(this.homeY + 0.002 * game.wave, GROUND_Y - 50);   // slowly creeps lower
    this.y += (this.homeY + Math.sin(this.t * 0.05) * 3 - this.y) * 0.03;
    this.x += this.vx;
    if (this.x < 10 || this.x > VIEW_W - 10) { this.dir *= -1; this.x = clamp(this.x, 10, VIEW_W - 10); }
    if (this.y > 0 && --this.shootT <= 0) {
      slimes.push(new Slime(this.x, this.y + 4, bunny.x + random(-12, 12), GROUND_Y - 6));
      Sfx.slime();
      this.shootT = random(220, 360) / (1 + game.wave * 0.05);
    }
  }
}

// Scoots along the moon and hugs the bunny. Aggressively.
class Crawler extends Enemy {
  constructor() {
    super({ hp: 2, points: 150, w: 9, h: 8, frames: [SPR.crawlerA, SPR.crawlerB], flash: SPR.crawlerFlash,
            goo: [C.lime, C.green, C.white] });
    this.dir = random([-1, 1]);
    this.x = this.dir > 0 ? -8 : VIEW_W + 8;
    this.y = GROUND_Y - this.h / 2;
    this.speed = 0.2 + game.wave * 0.025;
  }

  get vx() { return this.dir * this.speed; }

  update() {
    this.tick();
    this.dir = Math.sign(bunny.x - this.x) || this.dir;
    this.x += this.vx;
    this.bobY = -Math.round(Math.abs(Math.sin(this.t * 0.12)) * 2);
    if (boxesOverlap(this.box, bunny.box)) {
      this.dead = true;
      burst(this.x, this.y, 10, this.goo, 1.2);
      bunny.hurt('hit');
    }
  }
}

class CarrotGrenade {
  constructor(x, y, tx, ty) {
    const v = launch(x, y, tx, ty, GRAVITY, 2.4, 18, 55);
    Object.assign(this, { x, y, vx: v.vx, vy: v.vy, life: v.T });
    this.rot = 0;
    this.dead = false;
  }

  update() {
    this.vy += GRAVITY;
    this.x += this.vx;
    this.y += this.vy;
    this.rot += 0.35;
    this.life--;
    if (frameCount % 2 === 0) particles.push(new Particle(this.x, this.y, random(-0.2, 0.2), random(-0.2, 0.2), 12, random([C.yellow, C.orange]), 0));

    const hit = enemies.find(e => !e.dead && pointInBox(this.x, this.y, e.box, 2));
    if (hit || this.life <= 0 || this.y >= GROUND_Y - 1) {
      this.dead = true;
      detonate(this.x, Math.min(this.y, GROUND_Y - 1), hit);
    }
  }

  draw(g) {
    g.push();
    g.translate(Math.round(this.x), Math.round(this.y));
    g.rotate(this.rot);
    g.image(SPR.carrot, -2, -3);
    g.pop();
  }
}

class Slime {
  constructor(x, y, tx, ty) {
    this.grav = GRAVITY * 0.45;
    const v = launch(x, y, tx, ty, this.grav, 1.1, 50, 100);
    Object.assign(this, { x, y, vx: v.vx, vy: v.vy });
    this.dead = false;
  }

  update() {
    this.vy += this.grav;
    this.x += this.vx;
    this.y += this.vy;
    if (pointInBox(this.x, this.y, bunny.box)) {
      this.dead = true;
      burst(this.x, this.y, 8, [C.lime, C.green], 1);
      bunny.hurt('hit');
    } else if (this.y >= GROUND_Y - 1) {
      this.dead = true;
      burst(this.x, GROUND_Y - 1, 6, [C.lime, C.green], 0.8);
    } else if (this.x < -5 || this.x > VIEW_W + 5) {
      this.dead = true;
    }
  }

  draw(g) {
    const x = Math.round(this.x), y = Math.round(this.y);
    g.fill('rgba(57,255,20,0.4)');
    g.rect(Math.round(x - this.vx * 3), Math.round(y - this.vy * 3), 1, 1);
    g.fill(C.green);
    g.rect(x - 1, y - 1, 3, 3);
    g.fill(C.lime);
    g.rect(x - 1, y - 1, 1, 1);
  }
}

class Snack {
  constructor(type, x, y) {
    Object.assign(this, { type, x, y });
    this.img = SPR[SNACKS[type].sprite];
    this.t = 0;
    this.landed = false;
    this.groundT = 0;
    this.dead = false;
  }

  get box() {
    return { x: this.x - this.img.width / 2, y: this.y - this.img.height, w: this.img.width, h: this.img.height };
  }

  update() {
    this.t++;
    if (!this.landed) {
      this.y += 0.4;
      this.x += Math.sin(this.t * 0.05) * 0.25;
      if (this.y >= GROUND_Y) { this.y = GROUND_Y; this.landed = true; }
    } else if (++this.groundT > 600) {
      this.dead = true;
    }
    if (boxesOverlap(this.box, bunny.box)) {
      this.dead = true;
      burst(this.x, this.y - 3, 8, [C.yellow, C.white, C.hotPink], 0.9);
      SNACKS[this.type].apply();
    }
  }

  draw(g) {
    if (this.groundT > 480 && Math.floor(this.groundT / 5) % 2) return;   // blink before vanishing
    const b = this.box;
    if (!this.landed) blit(g, SPR.parachute, Math.round(this.x) - 4, b.y - 6);
    const hop = this.landed ? -Math.round(Math.abs(Math.sin(this.t * 0.1))) : 0;
    blit(g, this.img, b.x, b.y + hop);
  }
}

// Friendly delivery saucer that parachutes snacks down near the camera.
class SupplyShip {
  constructor() {
    const left = game.camX;
    this.dir = random([-1, 1]);
    this.x = this.dir > 0 ? left - 10 : left + VIEW_W + 10;
    this.y = 38;
    this.t = 0;
    this.dead = false;
    const count = random() < 0.4 ? 2 : 1;
    this.drops = Array.from({ length: count }, () => left + random(24, VIEW_W - 24)).sort((a, b) => (a - b) * this.dir);
  }

  update() {
    this.t++;
    this.x += this.dir * 0.7;
    if (this.drops.length && (this.x - this.drops[0]) * this.dir >= 0) {
      this.drops.shift();
      snacks.push(new Snack(pickSnackType(), this.x, this.y + 8));
    }
    if (this.x < game.camX - 30 || this.x > game.camX + VIEW_W + 30) this.dead = true;
  }

  draw(g) {
    const x = Math.round(this.x) - 7;
    const y = Math.round(this.y + Math.sin(this.t * 0.08)) - 3;
    blit(g, SPR.saucer, x, y);
    const lit = Math.floor(this.t / 8) % 3;
    [2, 7, 12].forEach((lx, i) => { g.fill(i === lit ? C.yellow : C.hotPink); g.rect(x + lx, y + 4, 1, 1); });
  }
}

class Particle {
  constructor(x, y, vx, vy, life, col, grav = 0.03) {
    Object.assign(this, { x, y, vx, vy, life, col, grav });
  }
  get dead() { return this.life <= 0; }
  update() {
    this.vy += this.grav;
    this.x += this.vx;
    this.y += this.vy;
    if (this.y > GROUND_Y + 2 && this.vy > 0) this.life = 0;
    this.life--;
  }
  draw(g) {
    g.fill(this.col);
    g.rect(Math.round(this.x), Math.round(this.y), 1, 1);
  }
}

class Explosion {
  constructor(x, y, colors) {
    Object.assign(this, { x, y, colors });
    this.t = 0;
  }
  get dead() { return this.t > 18; }
  update() { this.t++; }
  draw(g) {
    const [flash, outer, inner, ring] = this.colors;
    const r = Math.min(BLAST_RADIUS, 3 + this.t * 1.6);
    if (this.t < 4) {
      pixelDisc(g, this.x, this.y, r * 0.8, flash);
    } else if (this.t < 10) {
      pixelDisc(g, this.x, this.y, r, outer);
      pixelDisc(g, this.x, this.y, r * 0.6, inner);
    } else {
      pixelRing(g, this.x, this.y, r, ring);
      pixelRing(g, this.x, this.y, r - 3, 'rgba(185,103,255,0.6)');
    }
  }
}

// ---------------------------------------------------------------------
// 13. SPEECH — bunny quips and alien conversations
// ---------------------------------------------------------------------
function showLine(text, speaker = null) {
  Object.assign(speech, { text, speaker, shown: 0, life: 150 + text.length * 3 });
  speech.cooldown = speaker || speech.convo ? speech.life : 100;   // don't let quips interrupt chats
  game.idleT = 0;
}

function sayFrom(pool, force = false) {
  if (!force && speech.cooldown > 0) return;
  let line;
  do { line = random(pool); } while (pool.length > 1 && line === speech.last);
  speech.last = line;
  speech.queue = [];
  speech.convo = null;
  showLine(line.replace('{wave}', game.wave));
}
function say(category, force = false) { sayFrom(LINES[category], force); }

function talkTo(npc) {
  if (speech.convo === npc && speech.life > 0) { advanceSpeech(); return; }
  const [alienLine, bunnyReply] = npc.nextChat();
  speech.convo = npc;
  speech.queue = [{ text: bunnyReply, speaker: null }];
  if (!npc.met) {
    npc.met = true;
    if (allNpcs().every(n => n.met)) {
      speech.queue.push({ text: LINES.allFriends[0], speaker: null });
      showBanner('ALL FRIENDS MET!', 'solar system mayor', 220);
      Sfx.wave();
    }
  }
  showLine(alienLine, npc);
}

// Finish typing the current line, or skip to the next one.
function advanceSpeech() {
  if (speech.shown < speech.text.length) { speech.shown = speech.text.length; return; }
  if (speech.queue.length) { const next = speech.queue.shift(); showLine(next.text, next.speaker); return; }
  endConversation();
}

function endConversation() {
  speech.life = 0;
  speech.queue = [];
  speech.convo = null;
  speech.cooldown = 30;
}

function updateSpeech() {
  if (speech.cooldown > 0) speech.cooldown--;
  if (speech.life <= 0) return;
  if (--speech.life <= 0) {
    if (speech.queue.length) advanceSpeech();
    else speech.convo = null;
    return;
  }
  const before = Math.floor(speech.shown);
  speech.shown = Math.min(speech.text.length, speech.shown + 0.9);
  if (Math.floor(speech.shown) !== before && before % 3 === 0) Sfx.blip(!!speech.speaker);
}

function nearestNpc() {
  let best = null;
  for (const npc of currentNpcs()) {
    const d = Math.abs(npc.x - bunny.x);
    if (d < 18 && (!best || d < Math.abs(best.x - bunny.x))) best = npc;
  }
  return best;
}

// What E / Enter would interact with right now: the rocket or an alien.
function nearestTarget() {
  const npc = nearestNpc();
  const shipDist = Math.abs(World.theme.shipX - bunny.x);
  if (shipDist < 14 && (!npc || shipDist < Math.abs(npc.x - bunny.x))) return { kind: 'ship' };
  return npc ? { kind: 'npc', npc } : null;
}

// ---------------------------------------------------------------------
// 14. SPACE TRAVEL — star map, launch, flight scene, landing
// ---------------------------------------------------------------------
function dismissTip() {
  game.tip = null;
  say('explore', true);
  Sfx.select();
}

function openStarMap() {
  endConversation();
  game.travel = { phase: 'map', t: 0, sel: MAP_ORDER.indexOf(World.id), lift: 0 };
  Sfx.select();
}

function closeStarMap() { game.travel = null; }

function chooseDestination(i) {
  const dest = MAP_ORDER[i];
  if (dest === World.id) { closeStarMap(); say('samePlace', true); return; }
  game.travel = { phase: 'launch', t: 0, dest, lift: 0 };
  say('launch', true);
  Sfx.launch();
}

function updateTravel() {
  const tr = game.travel;
  tr.t++;
  if (tr.phase === 'launch') {
    tr.lift = tr.t * tr.t * 0.03;
    shipExhaust(tr);
    if (tr.t >= LAUNCH_FRAMES) {
      World.get(tr.dest);   // bake the destination now, hidden by the flight scene
      Object.assign(tr, { phase: 'flight', t: 0, stars: makeFlightStars() });
    }
  } else if (tr.phase === 'flight') {
    tr.stars.forEach(s => {
      s.x -= s.speed;
      if (s.x < -6) { s.x = VIEW_W + random(10); s.y = random(VIEW_H); }
    });
    if (tr.t === 40) say('flight', true);
    if (tr.t >= FLIGHT_FRAMES) {
      arriveAt(tr.dest);
      Object.assign(tr, { phase: 'landing', t: 0 });
      Sfx.land();
    }
  } else if (tr.phase === 'landing') {
    tr.lift = Math.pow(Math.max(0, LANDING_FRAMES - tr.t), 2) * 0.04;
    shipExhaust(tr);
    if (tr.t >= LANDING_FRAMES) finishLanding();
  }
}

function makeFlightStars() {
  return Array.from({ length: 50 }, () => ({
    x: random(VIEW_W), y: random(VIEW_H), speed: random(1, 6), col: random([C.white, C.cyan, C.hotPink, C.yellow]),
  }));
}

function shipExhaust(tr) {
  const x = World.theme.shipX;
  const bottom = horizonY(x) + 1 - tr.lift;
  particles.push(new Particle(x + random(-1, 1), bottom, random(-0.3, 0.3), random(0.4, 0.9), 20,
                              random([C.yellow, C.orange, C.pink]), 0));
  if (tr.lift < 25 && random() < 0.5) {   // dust kicked up from the launch pad
    particles.push(new Particle(x + random(-8, 8), GROUND_Y - 1, random(-0.8, 0.8), random(-0.4, -0.1), 30,
                                random([World.theme.ground.light, World.theme.ground.base]), 0.01));
  }
}

function arriveAt(dest) {
  World.enter(dest);
  game.visited.add(dest);
  snacks = []; ships = []; grenades = []; explosions = []; particles = []; popups = [];
  bunny.x = World.theme.shipX + 14;
  bunny.y = GROUND_Y;
  game.camX = clamp(bunny.x - VIEW_W / 2, 0, worldWidth() - VIEW_W);
}

function finishLanding() {
  const theme = World.theme;
  game.travel = null;
  bunny.face = 1;
  bunny.vy = -1.8;
  bunny.onGround = false;
  burst(bunny.x, bunny.y - 8, 12, NEON, 1);
  showBanner(theme.name, theme.tagline, 180);
  sayFrom([theme.arrival], true);
}

// ---------------------------------------------------------------------
// 15. GAME ACTIONS
// ---------------------------------------------------------------------
function burst(x, y, n, cols, speed = 1, grav = 0.03) {
  for (let i = 0; i < n; i++) {
    const a = random(TWO_PI), s = random(0.3, 1) * speed;
    particles.push(new Particle(x, y, Math.cos(a) * s, Math.sin(a) * s - 0.3, random(20, 40), random(cols), grav));
  }
}

function popup(text, col, x = bunny.x, y = bunny.y - 24) {
  popups.push({ text, col, x, y, life: 60 });
}

function showBanner(title, sub, t) {
  game.banner = { title, sub, t, t0: t };
}

// `food` is a key of EAT_LINES / EAT_POPUPS.
function feed(amount, food) {
  const wasHangry = game.hunger < 25;
  game.hunger = Math.min(100, game.hunger + amount);
  game.snackStreak = frameCount - game.lastSnackAt < 300 ? game.snackStreak + 1 : 1;
  game.lastSnackAt = frameCount;
  game.happyT = 240;
  bunny.chewT = 50;
  burst(bunny.x + bunny.face * 2, bunny.y - 7, 6, [C.orange, C.yellow], 0.6);
  Sfx.eat();
  const pop = EAT_POPUPS[food];
  popup(random(pop.words), pop.color);
  sayFrom(eatingLines(food, wasHangry), !speech.convo);   // never interrupt an alien chat
}

function eatingLines(food, wasHangry) {
  if (wasHangry) return EAT_LINES.hangry;
  if (game.hunger >= 100) return EAT_LINES.stuffed;
  if (game.snackStreak >= 3) return EAT_LINES.buffet;
  const local = World.theme.snackLines;
  if (isExplore() && local && random() < 0.35) return local;
  return EAT_LINES[food];
}

// Feed the bunny by hand. In PLAY mode this costs a carrot grenade.
function feedBunny() {
  if (game.hunger >= 95) { say('full', true); return; }
  if (isExplore()) { feed(15, 'handFed'); return; }
  if (game.ammo <= 0) { Sfx.empty(); say('noAmmo', true); return; }
  game.ammo--;
  feed(15, 'stash');
}

function throwOrigin(tx) {
  const face = tx < bunny.x ? -1 : 1;
  return { face, x: bunny.x + face * 4, y: bunny.y - 12 };
}

// In EXPLORE mode carrots are free, harmless fireworks.
function throwAt(tx, ty) {
  if (game.throwCD > 0) return;
  if (!isExplore() && game.ammo <= 0) { Sfx.empty(); say('noAmmo'); return; }
  const o = throwOrigin(tx);
  bunny.face = o.face;
  grenades.push(new CarrotGrenade(o.x, o.y, tx, Math.min(ty, GROUND_Y - 1)));
  game.throwCD = THROW_COOLDOWN;
  Sfx.toss();
  if (isExplore()) return;
  game.ammo--;
  if (game.ammo === 0) say('lastCarrot', true);
}

// Keyboard throw: aim at the nearest visible alien, leading its movement.
function throwAuto() {
  const target = enemies
    .filter(e => !e.dead && e.y > 0)
    .sort((a, b) => dist(a.x, a.y, bunny.x, bunny.y) - dist(b.x, b.y, bunny.x, bunny.y))[0];
  if (!target) { throwAt(bunny.x + bunny.face * 60, isExplore() ? GROUND_Y - 50 : GROUND_Y - 1); return; }
  const o = throwOrigin(target.x);
  const { T } = launch(o.x, o.y, target.x, target.y, GRAVITY, 2.4, 18, 55);
  throwAt(target.x + target.vx * T, target.y);
}

function detonate(x, y, directHit) {
  if (isExplore()) {
    explosions.push(new Explosion(x, y, [C.white, random(NEON), random(NEON), random(NEON)]));
    burst(x, y, 24, NEON, 1.6, 0.015);
    Sfx.pop();
    if (random() < 0.15) say('firework');
    return;
  }

  explosions.push(new Explosion(x, y, [C.white, C.orange, C.yellow, C.hotPink]));
  burst(x, y, 16, [C.yellow, C.orange, C.hotPink, C.white], 1.8);
  burst(x, y, 5, [C.green, C.lime], 1.0);
  game.shake = Math.max(game.shake, 4);
  Sfx.boom();

  let kills = 0;
  if (directHit && directHit.damage(1)) kills++;   // direct hits deal bonus damage
  for (const e of enemies) {
    if (!e.dead && dist(x, y, e.x, e.y) <= BLAST_RADIUS && e.damage(1)) kills++;
  }
  slimes.forEach(s => { if (dist(x, y, s.x, s.y) <= BLAST_RADIUS) s.dead = true; });

  if (kills >= 2) {
    const bonus = 100 * kills;
    game.score += bonus;
    popup(`COMBO x${kills}!`, C.hotPink, x, y - 14);
    say('combo', true);
  } else if (kills === 1 && random() < 0.4) {
    say('kill');
  }
}

function onEnemyKilled(e) {
  game.score += e.points;
  game.happyT = 150;
  popup(`+${e.points}`, C.yellow, e.x, e.y - 8);
  burst(e.x, e.y, 12, e.goo, 1.3);
}

function pickSnackType() {
  const table = {
    carrot: game.ammo < 4 && !isExplore() ? 70 : 40,
    cheese: 25,
    cookie: 22,
    heart: !isExplore() && game.hearts < MAX_HEARTS ? 12 : 0,
  };
  let r = random(Object.values(table).reduce((a, b) => a + b, 0));
  for (const [type, weight] of Object.entries(table)) {
    if ((r -= weight) < 0) return type;
  }
  return 'carrot';
}

function currentMood() {
  if (game.state === 'over' || bunny.invulnT > INVULN_FRAMES - 30) return MOODS.grumpy;
  if (game.hunger < 25) return MOODS.hangry;
  if (game.happyT > 0) return MOODS.sassy;
  return MOODS.moody;
}

// ---------------------------------------------------------------------
// 16. GAME FLOW
// ---------------------------------------------------------------------
function resetWorld() {
  bunny = new Bunny();
  enemies = []; grenades = []; slimes = []; snacks = []; ships = [];
  explosions = []; particles = []; popups = [];
  game.npcsByWorld = Object.fromEntries(Object.entries(THEMES).map(([id, theme]) => [id, theme.npcs.map(d => new Npc(d, id))]));
  game.visited = new Set(['moon']);
  Object.assign(game, {
    score: 0, hearts: MAX_HEARTS, ammo: START_AMMO, hunger: 100, camX: 0, travel: null,
    wave: 0, toSpawn: 0, spawnT: 0, nextWaveT: 0, banner: null,
    supplyT: 180, starveT: 0, happyT: 0, shake: 0, throwCD: 0,
    idleT: 0, overT: 0, warnedHungry: false, newBest: false,
    snackStreak: 0, lastSnackAt: -9999, tip: null,
  });
  World.enter('moon');
  endConversation();
}

function startGame(mode) {
  resetWorld();
  game.mode = mode;
  game.state = 'play';
  if (mode === 'play') {
    startWave(1, true);
    say('start', true);
  } else {
    bunny.x = 112;   // right next to the Carrot Rocket
    game.supplyT = 360;
    game.tip = { t: 0 };   // "you can fly to other planets!" pop-up
  }
}

function goToMenu() {
  resetWorld();
  game.mode = 'play';
  game.state = 'title';
  bunny.x = 48;
  say('title', true);
}

function startWave(n, quiet = false) {
  game.wave = n;
  game.toSpawn = 2 + n;
  game.spawnT = 120;
  showBanner(`WAVE ${n}`, 'evil aliens incoming!', 150);
  Sfx.wave();
  if (!quiet) say('wave', true);
}

function gameOver() {
  game.state = 'over';
  game.overT = 0;
  if (game.score > game.hiScore) {
    game.hiScore = game.score;
    game.newBest = true;
    saveHiScore(game.score);
  }
  grenades.forEach(o => burst(o.x, o.y, 4, [C.orange], 0.5));
  slimes.forEach(o => burst(o.x, o.y, 4, [C.lime], 0.5));
  grenades = [];
  slimes = [];
  say('gameover', true);
  speech.life = Infinity;
  Sfx.gameOver();
}

function togglePause() {
  if (game.state === 'play') game.state = 'paused';
  else if (game.state === 'paused') game.state = 'play';
}

// ---------------------------------------------------------------------
// 17. UPDATE
// ---------------------------------------------------------------------
function updateAll(list) {
  list.forEach(o => o.update());
  return list.filter(o => !o.dead);
}

function updatePlay() {
  if (game.tip) {   // the rocket pop-up pauses the action until dismissed (or it times out)
    bunny.update({ left: false, right: false });
    updateEffects();
    if (++game.tip.t > TIP_FRAMES) dismissTip();
    return;
  }
  if (game.travel) {
    if (game.travel.phase === 'map') bunny.update({ left: false, right: false });
    else updateTravel();
    updateEffects();
    return;
  }

  bunny.update({
    left: keyIsDown(KEY.left) || keyIsDown(KEY.a) || game.held.has('left'),
    right: keyIsDown(KEY.right) || keyIsDown(KEY.d) || game.held.has('right'),
  });
  updateHunger();
  if (game.state !== 'play') return;   // starved
  if (!isExplore()) updateWaves();
  updateSupply();

  enemies = updateAll(enemies);
  if (game.state !== 'play') return;   // an enemy may have ended the game
  grenades = updateAll(grenades);
  slimes = updateAll(slimes);
  if (game.state !== 'play') return;
  snacks = updateAll(snacks);
  ships = updateAll(ships);
  updateEffects();

  // Walking away politely ends a chat.
  if (speech.convo && Math.abs(speech.convo.x - bunny.x) > 60) endConversation();

  if (game.throwCD > 0) game.throwCD--;
  if (game.happyT > 0) game.happyT--;
  if (game.banner && --game.banner.t <= 0) game.banner = null;
  if (++game.idleT > 620) sayFrom(isExplore() ? World.theme.idle : LINES.idle);
}

function updateHunger() {
  const drain = HUNGER_DRAIN * (isExplore() ? 0.6 : 1 + game.wave * 0.04);
  game.hunger = Math.max(0, game.hunger - drain);
  if (game.hunger < 25 && !game.warnedHungry) { game.warnedHungry = true; say('hungry', !speech.convo); }
  if (game.hunger > 40) game.warnedHungry = false;
  if (isExplore() || game.hunger > 0) { game.starveT = 0; return; }   // exploring is never dangerous
  if (++game.starveT >= STARVE_INTERVAL) {
    game.starveT = 0;
    bunny.hurt('starving', true);
  }
}

function updateWaves() {
  if (game.toSpawn > 0) {
    if (--game.spawnT <= 0) {
      const crawlerChance = Math.min(0.4, 0.05 + game.wave * 0.05);
      enemies.push(random() < crawlerChance ? new Crawler() : new Flyer());
      game.toSpawn--;
      game.spawnT = Math.max(60, 170 - game.wave * 8) * random(0.8, 1.3);
    }
  } else if (enemies.length === 0 && game.nextWaveT === 0) {
    const bonus = game.wave * 250;
    game.score += bonus;
    showBanner('WAVE CLEAR!', `+${bonus} bonus`, 130);
    game.nextWaveT = 200;
    say('waveClear');
    Sfx.pickup();
  }
  if (game.nextWaveT > 0 && --game.nextWaveT === 0) startWave(game.wave + 1);
}

function updateSupply() {
  const carrotsAround = snacks.some(s => s.type === 'carrot');
  if (!isExplore() && game.ammo === 0 && !carrotsAround && game.supplyT > 120) game.supplyT = 120;   // never soft-lock
  if (--game.supplyT <= 0) {
    ships.push(new SupplyShip());
    game.supplyT = random(360, 560);
  }
}

function updateEffects() {
  explosions = updateAll(explosions);
  particles = updateAll(particles);
  popups.forEach(p => { p.y -= 0.25; p.life--; });
  popups = popups.filter(p => p.life > 0);
  game.shake = Math.max(0, game.shake - 0.3);
}

function updateAmbient() {
  bunny.update({ left: false, right: false });
  updateEffects();
  if (game.state === 'title') {
    if (random() < 0.004) bunny.jump();
    if (++game.idleT > 300) say('title');
  } else {
    game.overT++;
  }
}

// Returns how far the camera moved (weather uses it for parallax).
function updateCamera() {
  const before = game.camX;
  const maxX = worldWidth() - VIEW_W;
  const target = clamp(bunny.x - VIEW_W / 2, 0, maxX);
  game.camX = Math.round(clamp(game.camX + (target - game.camX) * 0.12, 0, maxX));
  return game.camX - before;
}

// ---------------------------------------------------------------------
// 18. RENDER — low-res world
// ---------------------------------------------------------------------
const travelPhase = () => (game.travel ? game.travel.phase : null);
const bunnyInShip = () => ['launch', 'flight', 'landing'].includes(travelPhase());

function renderWorld(g) {
  if (travelPhase() === 'flight') { drawFlight(g, game.travel); return; }

  World.drawSky(g);
  g.push();
  g.translate(-game.camX, 0);
  World.drawGround(g);
  ships.forEach(o => o.draw(g));
  snacks.forEach(o => o.draw(g));
  enemies.forEach(o => o.draw(g));
  if (!bunnyInShip()) bunny.draw(g, currentMood());
  grenades.forEach(o => o.draw(g));
  slimes.forEach(o => o.draw(g));
  explosions.forEach(o => o.draw(g));
  particles.forEach(o => o.draw(g));
  if (game.state === 'play' && !game.travel) drawCursor(g);
  g.pop();
  World.drawWeather(g);

  if (game.state !== 'title') drawHud(g);
  if (game.state === 'play' && isExplore() && !game.travel) drawEdgeArrows(g);
  if (travelPhase() === 'map') drawStarMap(g, game.travel);
  if (game.tip) drawRocketArrow(g);
}

// Dotted throw arc + reticle, or a heart / speech cursor over the bunny, an alien or the rocket.
function drawCursor(g) {
  if (game.touchMode || !mouseInView()) return;   // no hover cursor on touch screens
  const m = mouseWorld();
  if (bunnyAt(m)) { blit(g, SPR.heart, m.x - 3, m.y - 3); return; }
  if (isExplore() && (npcAt(m) || shipAt(m))) { drawChatIcon(g, m.x, m.y); return; }

  const armed = isExplore() || game.ammo > 0;
  const ty = Math.min(m.y, GROUND_Y - 1);
  const o = throwOrigin(m.x);
  const { T, vx, vy: vy0 } = launch(o.x, o.y, m.x, ty, GRAVITY, 2.4, 18, 55);
  let x = o.x, y = o.y, vy = vy0;
  g.fill(armed ? 'rgba(255,255,255,0.75)' : 'rgba(106,88,168,0.8)');
  for (let i = 1; i <= T; i++) {
    vy += GRAVITY; x += vx; y += vy;
    if ((i + (World.t >> 2)) % 5 === 0) g.rect(Math.round(x), Math.round(y), 1, 1);
  }
  const rx = Math.round(m.x), ry = Math.round(ty);
  g.fill(armed ? C.hotPink : C.moonDark);
  g.rect(rx - 3, ry, 2, 1); g.rect(rx + 2, ry, 2, 1);
  g.rect(rx, ry - 3, 1, 2); g.rect(rx, ry + 2, 1, 2);
}

function drawChatIcon(g, x, y) {
  x = Math.round(x) - 3;
  y = Math.round(y) - 3;
  g.fill(C.white); g.rect(x, y, 7, 4); g.rect(x + 1, y + 4, 2, 1);
  g.fill(C.ink); g.rect(x + 1, y + 2, 1, 1); g.rect(x + 3, y + 2, 1, 1); g.rect(x + 5, y + 2, 1, 1);
}

function npcAt(w) { return currentNpcs().find(npc => pointInBox(w.x, w.y, npc.box, 3)); }
function shipAt(w) { return pointInBox(w.x, w.y, shipBox(), 2); }

function drawEdgeArrows(g) {
  if (!blink(40)) return;
  const y = GROUND_Y - 24;
  g.fill(C.yellow);
  if (game.camX < worldWidth() - VIEW_W) {
    for (let i = 0; i < 3; i++) g.rect(VIEW_W - 7 + i, y - 2 + i, 1, 5 - i * 2);
  }
  if (game.camX > 0) {
    for (let i = 0; i < 3; i++) g.rect(6 - i, y - 2 + i, 1, 5 - i * 2);
  }
}

function drawHud(g) {
  if (!isExplore()) {
    const lowHeart = game.hearts === 1 && !blink(20);
    for (let i = 0; i < MAX_HEARTS; i++) {
      const full = i < game.hearts && !(lowHeart && i === 0);
      blit(g, full ? SPR.heart : SPR.heartEmpty, 4 + i * 8, 3);
    }
    blit(g, SPR.carrot, VIEW_W - 23, 15);
  }

  const bx = 4, by = 12, bw = 40, bh = 5;
  const fillW = Math.round(bw * game.hunger / 100);
  g.fill(C.black); g.rect(bx - 1, by - 1, bw + 2, bh + 2);
  g.fill('#3a1d5c'); g.rect(bx, by, bw, bh);
  g.fill(game.hunger > 50 ? C.green : game.hunger > 25 ? C.yellow : blink(20) ? C.red : C.hotPink);
  g.rect(bx, by, fillW, bh);
  g.fill('rgba(255,255,255,0.4)'); g.rect(bx, by, fillW, 1);
}

function drawStarMap(g, tr) {
  g.fill('rgba(7,1,26,0.93)');
  g.rect(8, 6, VIEW_W - 16, VIEW_H - 12);
  g.fill(C.cyan);   // notched pixel frame
  g.rect(9, 6, VIEW_W - 18, 1); g.rect(9, VIEW_H - 7, VIEW_W - 18, 1);
  g.rect(8, 7, 1, VIEW_H - 14); g.rect(VIEW_W - 9, 7, 1, VIEW_H - 14);

  pixelDisc(g, 20, MAP_Y, 9, 'rgba(255,159,28,0.3)');   // the sun
  pixelDisc(g, 20, MAP_Y, 6, C.gold);
  pixelDisc(g, 19, MAP_Y - 1, 3, C.yellow);
  g.fill('rgba(185,103,255,0.5)');
  for (let x = 30; x < VIEW_W - 12; x += 3) g.rect(x, MAP_Y, 1, 1);

  MAP_ORDER.forEach((id, i) => {
    const x = MAP_X[i];
    drawPlanetIcon(g, THEMES[id], x, MAP_Y, THEMES[id].icon.mapR || 5);
    if (id === World.id) {   // bunny ears = you are here
      g.fill(C.hotPink);
      g.rect(x - 2, MAP_Y - 17, 1, 4); g.rect(x + 2, MAP_Y - 17, 1, 4);
    }
    if (i === tr.sel && blink(30)) {   // selection brackets
      g.fill(C.yellow);
      [[-11, -11], [8, -11], [-11, 10], [8, 10]].forEach(([dx, dy]) => {
        g.rect(x + dx, MAP_Y + dy, 3, 1);
        g.rect(x + dx + (dx < 0 ? 0 : 2), MAP_Y + dy + (dy < 0 ? 0 : -2), 1, 3);
      });
    }
  });
}

// ---------------------------------------------------------------------
// 19. RENDER — full-res UI text layer
// ---------------------------------------------------------------------
function uiText(str, lx, ly, col, size = 1, align = LEFT) {
  textSize(FS * size);
  textAlign(align, TOP);
  const sh = Math.max(1, Math.round(FS * size / 8));
  fill(C.black);
  text(str, lx * S + sh, ly * S + sh);
  fill(col);
  text(str, lx * S, ly * S);
}

function rainbowText(str, cx, ly, size) {
  textSize(FS * size);
  textAlign(LEFT, TOP);
  const cw = textWidth('M');
  const x0 = cx * S - (cw * str.length) / 2;
  const sh = Math.max(1, Math.round(FS * size / 8));
  [...str].forEach((ch, i) => {
    const x = x0 + i * cw;
    const y = ly * S + Math.round(Math.sin(frameCount * 0.08 + i * 0.6)) * S;
    fill(C.black); text(ch, x + sh, y + sh);
    fill(NEON[(i + Math.floor(frameCount / 10)) % NEON.length]); text(ch, x, y);
  });
}

function pixelBox(x, y, w, h, b, fillCol, borderCol) {   // notched corners = 8-bit window
  [x, y, w, h] = [x, y, w, h].map(Math.round);
  fill(borderCol);
  rect(x + b, y, w - 2 * b, b);
  rect(x + b, y + h - b, w - 2 * b, b);
  rect(x, y + b, b, h - 2 * b);
  rect(x + w - b, y + b, b, h - 2 * b);
  fill(fillCol);
  rect(x + b, y + b, w - 2 * b, h - 2 * b);
}

const borderSize = () => Math.max(2, Math.round(S * 0.75));

function panel(lx, ly, lw, lh, borderCol = C.cyan) {
  pixelBox(lx * S, ly * S, lw * S, lh * S, borderSize(), 'rgba(18,4,36,0.88)', borderCol);
}

function wrapText(str, maxW) {
  const lines = [];
  let line = '';
  for (const word of str.split(' ')) {
    const test = line ? `${line} ${word}` : word;
    if (textWidth(test) > maxW && line) { lines.push(line); line = word; }
    else line = test;
  }
  if (line) lines.push(line);
  return lines;
}

function speechAnchor(npc) {
  if (npc) return { x: npc.x, y: npc.top - 2 };
  if (travelPhase() === 'flight') return { x: game.camX + 110, y: 56 };
  if (bunnyInShip()) return { x: World.theme.shipX, y: shipTop() - 2 };
  return { x: bunny.x, y: bunny.y - 18 };
}

// Bunny talks in a light bubble; aliens talk in a dark bubble with a name tag.
function drawSpeechBubble() {
  if (speech.life <= 0 || !speech.text || travelPhase() === 'map') return;
  const npc = speech.speaker;
  const style = npc
    ? { bg: C.night, border: npc.tagColor, ink: C.white }
    : { bg: '#fff4fb', border: C.ink, ink: C.ink };

  textSize(FS);
  textAlign(LEFT, TOP);
  const padding = Math.round(FS * 0.7);
  const lineH = Math.round(FS * 1.5);
  const b = borderSize();
  const lines = wrapText(speech.text, Math.min(FS * 20, gameW() * 0.6));   // wrap the full line so the box doesn't jitter
  const header = npc ? npc.name : null;
  const rows = lines.length + (header ? 1 : 0);
  const boxW = Math.max(...lines.map(l => textWidth(l)), header ? textWidth(header) : 0) + padding * 2;
  const boxH = rows * lineH - (lineH - FS) + padding * 2;

  const anchor = speechAnchor(npc);
  const ax = (anchor.x - game.camX) * S;
  const ay = anchor.y * S;
  const bx = Math.round(clamp(ax - boxW / 2, b, gameW() - boxW - b));
  const by = Math.round(Math.max(b, ay - b * 3 - boxH));
  pixelBox(bx, by, boxW, boxH, b, style.bg, style.border);

  const tx = Math.round(clamp(ax, bx + b * 4, bx + boxW - b * 4));   // stepped tail
  for (let i = 0; i < 3; i++) {
    const outer = (3 - i) * 2 * b, inner = outer - 2 * b;
    const ry = by + boxH - b + i * b;
    fill(style.border); rect(tx - outer / 2, ry, outer, b);
    if (inner > 0) { fill(style.bg); rect(tx - inner / 2, ry, inner, b); }
  }

  let row = 0;
  if (header) { fill(npc.tagColor); text(header, bx + padding, by + padding); row = 1; }
  fill(style.ink);
  let remaining = Math.ceil(speech.shown);
  lines.forEach((ln, i) => {
    text(ln.slice(0, Math.max(0, remaining)), bx + padding, by + padding + (i + row) * lineH);
    remaining -= ln.length + 1;
  });
}

// ---------------------------------------------------------------------
// 20. LAYOUT — fits the game to any screen, desktop or phone
// ---------------------------------------------------------------------
const gameW = () => VIEW_W * S;
const gameH = () => VIEW_H * S;

// Landscape: the game fills the screen and touch buttons float over its corners.
// Portrait phones: the game sits at the top and the buttons get the space below it.
function computeLayout() {
  const W = windowWidth, H = windowHeight;
  const portrait = game.touchMode && H > W;
  const fit = Math.min(W / VIEW_W, (portrait ? H * 0.5 : H) / VIEW_H);
  S = fit >= 3 ? Math.floor(fit) : fit;   // whole-number pixels when there's room, otherwise fill the screen
  FS = Math.max(8, Math.round(3 * S));
  OX = Math.round((W - gameW()) / 2);
  OY = portrait ? Math.round(H * 0.05) : Math.round((H - gameH()) / 2);
  CONTROLS = portrait ? portraitControls(W, H, OY + gameH()) : landscapeControls(W, H);
}

function landscapeControls(W, H) {
  const b = Math.round(Math.min(H * 0.17, W * 0.1, 84));
  const m = Math.round(b * 0.22);
  const y = H - m - b;
  return [
    { id: 'left',   x: m,                 y,             w: b, h: b },
    { id: 'right',  x: m * 2 + b,         y,             w: b, h: b },
    { id: 'throw',  x: W - m * 2 - b * 2, y,             w: b, h: b },
    { id: 'jump',   x: W - m - b,         y,             w: b, h: b },
    { id: 'action', x: W - m - b,         y: y - m - b,  w: b, h: b },
    { id: 'pause',  x: W / 2 - b * 0.35,  y: m * 0.6,    w: b * 0.7, h: b * 0.55 },
  ];
}

function portraitControls(W, H, top) {
  const zone = H - top;
  const b = Math.round(Math.min(W / 5.2, zone / 3.2));
  const m = Math.round(b * 0.18);
  const mid = top + zone / 2;
  return [
    { id: 'left',   x: m,                     y: mid - b / 2,  w: b, h: b },
    { id: 'right',  x: m * 2 + b,             y: mid - b / 2,  w: b, h: b },
    { id: 'throw',  x: W - m * 2 - b * 2,     y: mid,          w: b, h: b },
    { id: 'jump',   x: W - m - b,             y: mid,          w: b, h: b },
    { id: 'action', x: W - m * 1.5 - b * 1.5, y: mid - m - b,  w: b, h: b },
    { id: 'pause',  x: W / 2 - b * 0.35,      y: top + m,      w: b * 0.7, h: b * 0.55 },
  ];
}

// ---------------------------------------------------------------------
// 21. TOUCH CONTROLS
// ---------------------------------------------------------------------
const controlsActive = () => game.touchMode && game.state === 'play' && !game.travel && !game.tip;
const inRect = (x, y, r) => x >= r.x && x <= r.x + r.w && y >= r.y && y <= r.y + r.h;

function controlAt(x, y) {
  return controlsActive() ? CONTROLS.find(btn => inRect(x, y, btn)) : null;
}

// Which hold-buttons (left / right) have a finger on them right now.
function heldControls() {
  const held = new Set();
  if (!controlsActive()) return held;
  for (const t of touches) {
    const btn = CONTROLS.find(b => inRect(t.x, t.y, b));
    if (btn) held.add(btn.id);
  }
  return held;
}

function pressControl(btn) {
  if (btn.id === 'jump') bunny.jump();
  if (btn.id === 'throw') throwAuto();
  if (btn.id === 'action') doAction();
  if (btn.id === 'pause') togglePause();
}

function actionLabel() {
  if (!isExplore()) return 'FEED';
  if (speech.convo) return 'NEXT';
  const target = nearestTarget();
  if (!target) return 'FEED';
  return target.kind === 'ship' ? 'FLY' : 'TALK';
}

function drawTouchControls() {
  if (!controlsActive()) return;
  const b = Math.max(2, Math.round(CONTROLS[0].w / 18));
  const arrows = { left: 'left', right: 'right', jump: 'up' };
  const labels = { throw: 'THROW', action: actionLabel(), pause: 'II' };
  const colors = { left: C.cyan, right: C.cyan, jump: C.lime, throw: C.orange, action: C.hotPink, pause: C.moonLight };
  noStroke();
  textFont('Press Start 2P');
  textAlign(CENTER, CENTER);
  for (const btn of CONTROLS) {
    const held = game.held.has(btn.id);
    const cx = btn.x + btn.w / 2, cy = btn.y + btn.h / 2;
    pixelBox(btn.x, btn.y, btn.w, btn.h, b, held ? 'rgba(255,110,199,0.45)' : 'rgba(18,4,36,0.5)', colors[btn.id]);
    fill(colors[btn.id]);
    if (arrows[btn.id]) { drawPixelArrow(cx, cy, btn.w * 0.4, arrows[btn.id]); continue; }
    const label = labels[btn.id];
    textSize(Math.round(label.length > 2 ? btn.w / 7 : btn.h * 0.36));
    text(label, cx, cy + 1);
  }
}

// Stepped 8-bit arrow, `size` px across, using the current fill.
function drawPixelArrow(cx, cy, size, dir) {
  const steps = 5, px = Math.max(2, Math.round(size / steps));
  const half = Math.round((steps * px) / 2);
  cx = Math.round(cx); cy = Math.round(cy);
  for (let i = 0; i < steps; i++) {
    const len = (i * 2 + 1) * px;
    if (dir === 'up')    rect(cx - len / 2, cy - half + i * px, len, px);
    if (dir === 'left')  rect(cx - half + i * px, cy - len / 2, px, len);
    if (dir === 'right') rect(cx + half - (i + 1) * px, cy - len / 2, px, len);
  }
}

// ---------------------------------------------------------------------
// 22. P5 LIFECYCLE
// ---------------------------------------------------------------------
function setup() {
  pixelDensity(Math.min(2, window.devicePixelRatio || 1));   // crisp text on phone screens
  cnv = createCanvas(windowWidth, windowHeight);
  computeLayout();
  noSmooth();
  frameRate(60);

  view = createGraphics(VIEW_W, VIEW_H);
  view.pixelDensity(1);
  view.noSmooth();
  view.noStroke();

  bakeSprites();
  if (document.fonts) document.fonts.load('12px "Press Start 2P"');
  goToMenu();
}

function draw() {
  game.held = heldControls();
  if (game.state === 'play') updatePlay();
  else if (game.state !== 'paused') updateAmbient();
  if (game.state !== 'paused') {
    const dCam = updateCamera();
    World.update(dCam);
    updateSpeech();
  }
  if (!game.touchMode) {   // mouse hover highlights menu choices
    if (game.state === 'title') {
      const hovered = menuButtonAt(mouseScreen());
      if (hovered >= 0) game.menuIndex = hovered;
    }
    if (travelPhase() === 'map') {
      const hovered = mapPlanetAt(mouseScreen());
      if (hovered >= 0) game.travel.sel = hovered;
    }
  }

  renderWorld(view);
  background(C.space0);
  const shaking = game.shake > 0 && game.state !== 'paused';
  const sx = shaking ? Math.round(random(-game.shake, game.shake)) * S : 0;
  const sy = shaking ? Math.round(random(-game.shake, game.shake)) * S : 0;
  image(view, OX + sx, OY + sy, gameW(), gameH());
  push();
  translate(OX, OY);
  drawUI();
  pop();
  drawTouchControls();
  cursor(game.state === 'play' && !game.travel && !game.touchMode ? 'none' : 'pointer');
}

function windowResized() {
  resizeCanvas(windowWidth, windowHeight);
  computeLayout();
  noSmooth();
}

// ---------------------------------------------------------------------
// 23. INPUT — keyboard, mouse and touch all funnel into the same actions
// ---------------------------------------------------------------------
function keyPressed() {
  Sfx.unlock();
  const k = keyCode;
  if (k === KEY.m) Sfx.muted = !Sfx.muted;
  if (game.tip && game.state === 'play') { dismissTip(); return false; }

  if (game.state === 'title') handleMenuKey(k);
  else if (game.state === 'over') {
    if (game.overT > 60 && (k === KEY.enter || k === KEY.space)) startGame('play');
    if (k === KEY.q) goToMenu();
  } else if (game.state === 'paused') {
    if (k === KEY.p || k === KEY.esc) togglePause();
    if (k === KEY.q) goToMenu();
  } else if (game.state === 'play') {
    if (travelPhase() === 'map') handleMapKey(k);
    else if (!game.travel) handlePlayKey(k);
  }

  if ([KEY.space, KEY.left, KEY.up, KEY.right, KEY.down].includes(k)) return false;   // no page scroll
}

function handleMenuKey(k) {
  if ([KEY.left, KEY.right, KEY.up, KEY.down, KEY.a, KEY.d, KEY.w, KEY.s].includes(k)) {
    game.menuIndex = 1 - game.menuIndex;
    Sfx.select();
  }
  if (k === KEY.one) game.menuIndex = 0;
  if (k === KEY.two) game.menuIndex = 1;
  if ([KEY.enter, KEY.space, KEY.one, KEY.two].includes(k)) startGame(MENU[game.menuIndex].mode);
}

function handleMapKey(k) {
  const tr = game.travel;
  const n = MAP_ORDER.length;
  if (k === KEY.left || k === KEY.a) { tr.sel = (tr.sel + n - 1) % n; Sfx.select(); }
  if (k === KEY.right || k === KEY.d) { tr.sel = (tr.sel + 1) % n; Sfx.select(); }
  if (k === KEY.enter || k === KEY.space || k === KEY.e) chooseDestination(tr.sel);
  if (k === KEY.q || k === KEY.esc) closeStarMap();
}

function handlePlayKey(k) {
  if (k === KEY.p || k === KEY.esc) { togglePause(); return; }
  if (k === KEY.up || k === KEY.w) bunny.jump();
  if (k === KEY.space) throwAuto();
  if (k === KEY.f) feedBunny();
  if (k === KEY.e) doAction();
  if (!isExplore()) return;
  if (k === KEY.q) goToMenu();
  if (k === KEY.enter && (speech.convo || nearestTarget())) doAction();
}

// The context action (E key / action button): feed, talk, or fly.
function doAction() {
  if (!isExplore()) { feedBunny(); return; }
  if (speech.convo) { talkTo(speech.convo); return; }
  const target = nearestTarget();
  if (!target) feedBunny();
  else if (target.kind === 'ship') openStarMap();
  else talkTo(target.npc);
}

function mousePressed() {
  Sfx.unlock();
  pointerDown(mouseX, mouseY);
}

function mouseMoved() {   // a real mouse showed up: switch back to desktop hints
  if (game.touchMode && (movedX || movedY)) {
    game.touchMode = false;
    computeLayout();
  }
}

function touchStarted(event) {
  Sfx.unlock();
  if (!game.touchMode) {
    game.touchMode = true;
    computeLayout();
  }
  const rect = cnv.elt.getBoundingClientRect();
  for (const t of (event && event.changedTouches) || []) {
    const x = t.clientX - rect.left, y = t.clientY - rect.top;
    const btn = controlAt(x, y);
    if (btn) pressControl(btn);
    else pointerDown(x, y);
  }
  return false;   // no scrolling, zooming, or duplicate mouse events
}
function touchMoved() { return false; }
function touchEnded() { Sfx.unlock(); return false; }

// A click or tap at screen position (px, py).
function pointerDown(px, py) {
  const v = toView(px, py);
  if (game.state === 'title') {
    const i = menuButtonAt(v);
    if (i >= 0) startGame(MENU[i].mode);
    return;
  }
  if (game.state === 'over') {
    const btn = game.overT > 60 && buttonAt(OVER_BUTTONS, v);
    if (btn) btn.id === 'retry' ? startGame('play') : goToMenu();
    return;
  }
  if (game.state === 'paused') {
    const btn = buttonAt(PAUSE_BUTTONS, v);
    if (btn) btn.id === 'resume' ? togglePause() : goToMenu();
    return;
  }
  if (game.state !== 'play') return;
  if (game.tip) { dismissTip(); return; }
  if (game.travel) {
    if (game.travel.phase === 'map') tapStarMap(v);
    return;
  }
  if (!inView(v)) return;

  const w = toWorld(v);
  if (bunnyAt(w)) { feedBunny(); return; }
  if (isExplore()) {
    const npc = npcAt(w);
    const near = x => Math.abs(x - bunny.x) < 60;
    if (npc) {
      if (near(npc.x)) talkTo(npc);
      else popup('WALK CLOSER!', npc.tagColor, npc.x, npc.top - 6);
      return;
    }
    if (shipAt(w)) {
      if (near(World.theme.shipX)) openStarMap();
      else popup('WALK CLOSER!', C.orange, World.theme.shipX, shipTop() - 6);
      return;
    }
  }
  throwAt(w.x, w.y);
}

// First tap picks a planet, tapping it again flies there (a mouse hover already picks it).
function tapStarMap(v) {
  if (buttonAt([MAP_CLOSE], v)) { closeStarMap(); return; }
  const i = mapPlanetAt(v);
  if (i < 0) return;
  if (i === game.travel.sel) chooseDestination(i);
  else { game.travel.sel = i; Sfx.select(); }
}
</script>
